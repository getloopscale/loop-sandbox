{{- if .Values.nats.enabled }}
# NATS JetStream — the per-cell worker dispatch queue (M11). Single-node for self-host; a
# multi-replica cluster is the production topology (LOOPSANDBOX_NATS_REPLICAS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nats
  labels:
    app: {{ .Release.Name }}-nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-nats
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-nats
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-js"]
          ports:
            - containerPort: 4222
          readinessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nats
spec:
  selector:
    app: {{ .Release.Name }}-nats
  ports:
    - port: 4222
      targetPort: 4222
{{- end }}
