events {}
http {
    upstream api {
        server api-1:8080;
        server api-2:8080;
    }
    server {
        listen 8080;
        location / {
            proxy_pass http://api;
            proxy_next_upstream error timeout http_502 http_503; # fail over to the other replica
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $http_x_request_id;
        }
    }
}
