name: ci

# Gate for every change: static checks, unit tests, integration tests against a real
# PostgreSQL, and the conformance suite against the container driver. The Firecracker
# conformance run needs /dev/kvm, so it runs nightly and on demand instead of per PR.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [workspace, develop]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: vet, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted="$(gofmt -l cmd internal migrations test sdk/python/testserver)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: Vendor directory matches go.mod
        run: |
          go mod tidy
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor
      - name: Vet (all build tags)
        run: go vet -tags=integration,conformance,load,firecracker ./...
      - name: Build
        run: go build ./...
      - name: Build without the vendor directory
        run: go build -mod=mod ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags=integration,conformance,load,firecracker

  unit:
    name: unit tests (race detector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  integration:
    name: integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make test-integration

  conformance-container:
    name: conformance (container driver)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make conformance DRIVER=container

  conformance-firecracker:
    name: conformance (firecracker driver)
    # Runs nightly and on demand, not per PR: it downloads a kernel and a root
    # filesystem and boots real microVMs, and it needs a runner that exposes /dev/kvm.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Give the runner user access to /dev/kvm
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "this runner has no /dev/kvm; the firecracker driver cannot run here" >&2
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: make fc-assets
      - run: make fc-test
      - run: make conformance DRIVER=firecracker
