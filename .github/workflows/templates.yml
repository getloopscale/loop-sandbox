name: templates

# Builds the images of the built-in templates that this repository builds itself
# (templates/Dockerfile), runs each one the way a sandbox runs it, and on develop
# publishes it as ghcr.io/<repository>:template-<name>-<TEMPLATES_VERSION>.
#
# A published tag is never overwritten: a change to an image needs a new
# TEMPLATES_VERSION, which internal/templates/catalog.go must name too.
on:
  pull_request:
    paths: ["templates/**", ".github/workflows/templates.yml"]
  push:
    branches: [develop]
    paths: ["templates/**", ".github/workflows/templates.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEMPLATES_VERSION: "2026.11.28.1"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR on develop
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: base, target: base, check: "node --version && python --version && git --version" }
          - { name: claude, target: agent, package: "@anthropic-ai/claude-code", version: "2.1.332", check: "claude --version" }
          - { name: codex, target: agent, package: "@openai/codex", version: "0.172.0", check: "codex --version" }
          - { name: gemini, target: agent, package: "@google/gemini-cli", version: "0.71.1", check: "gemini --version" }
          - { name: opencode, target: agent, package: "opencode-ai", version: "1.19.6", check: "opencode --version" }
          - { name: openclaw, target: agent, package: "openclaw", version: "2026.11.11", check: "openclaw --version" }
          - { name: droid, target: agent, package: "@factory/cli", version: "1.23.0", check: "droid --version" }
          - { name: amp, target: agent, package: "@sourcegraph/amp", version: "0.0.1795852840-ga90fca", check: "amp --version" }
          - { name: desktop, target: desktop, check: "start-desktop && xdotool getdisplaygeometry && scrot /workspace/shot.png && test -s /workspace/shot.png" }
    env:
      NAME: ${{ matrix.name }}
      TARGET: ${{ matrix.target }}
      PACKAGE: ${{ matrix.package }}
      VERSION: ${{ matrix.version }}
      CHECK: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build
        run: |
          docker build templates --target "$TARGET" \
            --build-arg "PACKAGE=$PACKAGE" --build-arg "VERSION=$VERSION" \
            --tag "$IMAGE:template-$NAME-$TEMPLATES_VERSION"

      # The flags are the ones of internal/runtime/container/config.go: a template
      # that needs more than a sandbox gives it must fail here, not in a sandbox.
      - name: Run it the way a sandbox does
        run: |
          docker run --rm --user 65534:65534 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=67108864 \
            --tmpfs /workspace:rw,exec,nosuid,nodev,size=268435456 \
            --memory 512m --pids-limit 128 --ulimit nofile=1024:4096 \
            --env HOME=/workspace \
            "$IMAGE:template-$NAME-$TEMPLATES_VERSION" sh -c "touch /workspace/.writable && test -f /home/user/.writable && $CHECK"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish, unless the tag exists
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: |
          ref="$IMAGE:template-$NAME-$TEMPLATES_VERSION"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "::notice::$ref is already published and is left as it is; raise TEMPLATES_VERSION to publish a change"
            exit 0
          fi
          docker push "$ref"
          echo "published $ref" >> "$GITHUB_STEP_SUMMARY"
