[project]
name = "loopsandbox"
version = "0.21.0"
description = "Python SDK for LoopSandbox — run untrusted code in isolated microVM sandboxes"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []  # stdlib-only (urllib) — zero runtime deps

[project.optional-dependencies]
test = ["pytest>=7", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loopsandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
