[project]
name = "loopsandbox"
version = "0.1.0"
description = "Python SDK for LoopScale code sandboxes: run untrusted code in an isolated sandbox."
readme = "README.md"
keywords = ["sandbox", "code-interpreter", "loopscale", "ai-agents", "e2b"]
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []  # only the standard library (urllib)

[project.urls]
Homepage = "https://github.com/getloopscale/loop-sandbox#sdks"
Repository = "https://github.com/getloopscale/loop-sandbox"
Issues = "https://github.com/getloopscale/loop-sandbox/issues"

[project.optional-dependencies]
test = ["pytest>=7", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loopsandbox"]

[tool.hatch.build.targets.sdist]
include = ["loopsandbox", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
